<title>Hoyo 1 · Golf Club Peralada 3D</title>
<style>
:root{--bg:#8e9fa9;--panel:rgba(19,26,22,.9);--ink:#e8ede6;--mut:#97a69b;--acc:#d3b56e;--chip:#26322b;--on:#d3b56e;--onink:#141b16;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;justify-content:center}
.bar button,.tees button{font:600 14px/1 inherit;font-family:inherit;border:0;border-radius:999px;padding:10px 14px;background:var(--panel);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.18)}
.bar button.on,.tees button.on{background:var(--on);color:var(--onink)}
.hud{position:absolute;left:10px;right:10px;bottom:10px;background:var(--panel);border-radius:18px;padding:12px 16px 14px;box-shadow:0 2px 14px rgba(0,0,0,.22)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
#d{font:700 52px/1 ui-serif,Georgia,"Times New Roman",serif;color:var(--acc);font-variant-numeric:tabular-nums}
#d small{font:600 20px/1 ui-sans-serif,system-ui,sans-serif;color:var(--ink);margin-left:4px}
.lab{font-size:14px;color:var(--mut)}
.tees{display:flex;gap:6px;margin-top:10px}
.tees button{flex:1;box-shadow:none;background:var(--chip)}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px}
.lbl{position:absolute;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%);font:600 12px/1 ui-sans-serif,system-ui,sans-serif;background:var(--panel);color:var(--ink);padding:5px 8px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.lbl.m{background:var(--acc);color:#141b16;font-size:14px}
.hud>*{transition:opacity .25s}
.hud{transition:background .3s,box-shadow .3s}
.sheeted .hud{background:transparent;box-shadow:none}
.sheeted .hud>:not(.sheet):not(.fab){opacity:0;pointer-events:none}
.fab{position:absolute;right:0;top:-66px;z-index:30;width:54px;height:54px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.24);background:rgba(20,27,22,.36);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);color:var(--acc);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 18px rgba(0,0,0,.28);transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .25s}
.fab:active{transform:scale(.9)}
.fab svg,.ic svg{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fab svg{width:30px;height:30px}
.sheeted .fab{opacity:0;pointer-events:none;transform:scale(.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:16px 14px 14px;border-radius:28px;border:1px solid rgba(255,255,255,.18);background:rgba(14,20,16,.46);-webkit-backdrop-filter:blur(20px) saturate(1.35);backdrop-filter:blur(20px) saturate(1.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 24px 60px rgba(0,0,0,.4);transform:scale(.05);opacity:0;pointer-events:none;transition:transform .6s cubic-bezier(.2,1.15,.3,1),opacity .28s ease}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
.sh{display:flex;justify-content:space-between;align-items:flex-start;padding:2px 6px 6px}
.sh .k{font-size:13px;color:var(--mut)}
.sh .v{font:700 34px/1.1 ui-serif,Georgia,serif;color:var(--ink);font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--ink);font-size:22px;line-height:1}
.nt{font-size:12.5px;color:var(--mut);padding:0 6px 8px;min-height:16px}
.club{display:grid;grid-template-columns:44px 1fr auto;align-items:center;column-gap:12px;row-gap:8px;padding:10px 12px;margin-top:6px;border-radius:18px;border:1px solid transparent;background:rgba(255,255,255,.05);opacity:0;transform:translateY(18px) scale(.97);transition:opacity .4s,transform .55s cubic-bezier(.2,.9,.3,1.15),background .35s,border-color .35s,box-shadow .35s}
.open .club{opacity:1;transform:none;transition-delay:calc(var(--i)*70ms + 200ms),calc(var(--i)*70ms + 200ms),0s,0s,0s}
.club.best{background:rgba(211,181,110,.17);border-color:rgba(211,181,110,.65);box-shadow:0 0 26px rgba(211,181,110,.22)}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--mut)}
.best .ic,.best .pc{color:var(--acc)}
.ic svg{width:34px;height:34px;stroke-width:2.3}
.nm b{display:block;font-size:17px}
.nm span{font-size:12.5px;color:var(--mut)}
.pc{font:700 26px/1 ui-serif,Georgia,serif;font-variant-numeric:tabular-nums;color:var(--ink)}
.pc b{font:inherit}
.pc small{font:600 13px ui-sans-serif,system-ui,sans-serif;margin-left:2px;color:var(--mut)}
.tr{grid-column:1/-1;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.tr u{display:block;height:100%;width:0;text-decoration:none;border-radius:4px;background:linear-gradient(90deg,#b9964a,#f0dca0);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.open .tr u{width:calc(var(--p)*1%);transition-delay:calc(var(--i)*70ms + 320ms)}
@media (prefers-reduced-motion:reduce){.sheet,.club,.tr u,.fab{transition-duration:.01s!important;transition-delay:0s!important}}
/* Palos sobre el mapa, sin panel */
.sheet,.sheet.open{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;transform:none;opacity:1;pointer-events:none;bottom:calc(100% + 74px)}
.sh{display:none}
.nt{color:var(--ink);text-align:right;text-shadow:0 1px 8px rgba(0,0,0,.85);padding:0 4px 6px}
.sheeted .hud{background:var(--panel);box-shadow:0 2px 14px rgba(0,0,0,.22)}
.sheeted .hud>:not(.sheet):not(.fab){opacity:1;pointer-events:auto}
.sheeted .fab{opacity:1;pointer-events:auto;transform:none}
.fab .g1,.fab .g2{transition:opacity .3s,transform .45s cubic-bezier(.3,1.4,.5,1);transform-origin:24px 24px}
.fab .g2{opacity:0;transform:rotate(-90deg)}
.sheeted .fab .g1{opacity:0;transform:rotate(90deg)}
.sheeted .fab .g2{opacity:1;transform:none}
.club{grid-template-columns:46px 1fr 66px;column-gap:8px;padding:1px 0;margin-top:2px;border:0;border-radius:0;background:none;box-shadow:none;pointer-events:none;transform:translateX(90px) rotate(-7deg) scale(.9);filter:blur(6px);transition:opacity .45s,transform .7s cubic-bezier(.2,1.1,.3,1.15),filter .5s}
.open .club{filter:none;transition-delay:calc(var(--i)*80ms + 120ms)}
.club.best{background:none;border-color:transparent;box-shadow:none}
.cs{width:100%;height:46px;opacity:.8;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55));transition:opacity .4s,filter .4s}
.best .cs{opacity:1;filter:drop-shadow(0 0 9px rgba(211,181,110,.85)) drop-shadow(0 3px 5px rgba(0,0,0,.5))}
.nm b{font-size:18px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.best .nm b{color:var(--acc)}
.pc{text-shadow:0 1px 8px rgba(0,0,0,.7);text-align:right}
.nt{opacity:0;transition:opacity .4s}
.open .nt{opacity:1;transition-delay:.15s}
.club{height:52px;box-sizing:border-box}
.club i{display:block}
.sc{position:absolute;left:10px;top:58px;z-index:15;padding:8px 10px;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:rgba(14,20,16,.42);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.28)}
.sc-t{display:flex;justify-content:space-between;align-items:center;padding:0 2px 4px}
.sc-t b{font-size:13px;color:var(--mut);font-weight:600}
.sc-t button{width:28px;height:28px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--ink);font-size:15px;line-height:1}
.sc table{border-collapse:collapse}
.sc th{font:600 12px ui-sans-serif,system-ui,sans-serif;color:var(--mut);padding:2px 9px;text-align:center}
.sc td{font:600 17px ui-serif,Georgia,serif;font-variant-numeric:tabular-nums;padding:2px 9px;text-align:center;color:var(--ink)}
.sc td:first-child{font:600 12px ui-sans-serif,system-ui,sans-serif;color:var(--mut);text-align:left;padding-left:2px}
.sc th.cur{color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
.sc td.cur{color:var(--acc)}
.sc td.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.bn{position:absolute;left:50%;top:34%;z-index:25;pointer-events:none;text-align:center;opacity:0;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.75);transform:translate(-50%,-50%)}
.bn b{display:block;font:700 44px/1.05 ui-serif,Georgia,serif;color:var(--acc)}
.bn span{font-size:16px;font-weight:600}
.bn.sm b{font-size:22px}
.bn.show{animation:bn 2.8s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}18%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.gpsb{left:0;right:auto}
.gpsb.on{color:#5ac8fa}
.gpp{position:absolute;left:0;bottom:calc(100% + 74px);z-index:22;width:min(290px,100%);box-sizing:border-box;padding:12px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:rgba(14,20,16,.5);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 16px 40px rgba(0,0,0,.35);opacity:0;transform:translateY(14px) scale(.96);transform-origin:0 100%;pointer-events:none;transition:opacity .3s,transform .45s cubic-bezier(.2,1.2,.3,1)}
.gpp.open{opacity:1;transform:none;pointer-events:auto}
.sheeted .hud>.gpp:not(.open){opacity:0;pointer-events:none}
.gp-s{font-size:13px;color:var(--ink);padding:0 2px 4px;min-height:34px}
.gpp button{display:block;width:100%;margin-top:6px;padding:11px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.09);color:var(--ink);font:600 14px/1 ui-sans-serif,system-ui,sans-serif;text-align:left}
.gpp button.ok{border-color:rgba(127,213,138,.7);color:#7fd58a}
.gpp button.go{background:var(--on);color:var(--onink);border-color:transparent}
.gpp button:disabled{opacity:.4}
.sc{padding:5px 7px;border-radius:14px;top:54px}
.sc-t{padding:0 2px 2px}
.sc-t b{font-size:11px}
.sc-t button{width:22px;height:22px;font-size:12px}
.sc th{font-size:10.5px;padding:1px 6px}
.sc td{font-size:14px;padding:1px 6px}
.sc td:first-child{font-size:10.5px;padding-left:2px}
.bn.ob b{color:#ff8a7a}
/* Panel de metros compacto */
.hud,.sheeted .hud{display:grid;grid-template-columns:1fr auto;grid-template-areas:'d t' 'm t';align-items:center;column-gap:10px;padding:9px 10px 9px 16px;border-radius:24px;background:none;box-shadow:none;z-index:18}
.hud::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;border:1px solid rgba(255,255,255,.16);background:rgba(14,20,16,.5);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 10px 30px rgba(0,0,0,.3);pointer-events:none}
.row{grid-area:m;display:block}
.row .lab:first-child{display:none}
#from{font-size:11.5px;color:var(--mut)}
#d{grid-area:d;font-size:38px;line-height:1.05}
#d small{font-size:15px;margin-left:3px}
#d::after{content:'al hoyo';font:500 11.5px ui-sans-serif,system-ui,sans-serif;color:var(--mut);margin-left:8px}
.tees{grid-area:t;margin:0;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.tees button{flex:none;padding:8px 11px;font-size:12.5px;background:transparent;color:var(--mut)}
.tees button.on{background:var(--on);color:var(--onink)}
.tees em{font-style:normal;opacity:.65;font-weight:500;margin-left:5px}
.hint{display:none}
#d{white-space:nowrap}
.tees button{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1;padding:6px 12px}
.tees em{display:block;margin:0;font-size:10px}
.gp-v{font-size:10.5px;color:var(--mut);text-align:right;padding-top:6px}
.wx{position:absolute;right:10px;top:54px;z-index:15;display:flex;align-items:center;gap:8px;padding:5px 10px 5px 8px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(14,20,16,.42);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.28);max-width:58%}
.wx svg{width:22px;height:22px;flex:none;fill:var(--acc);transition:transform .8s cubic-bezier(.3,1.3,.5,1)}

    if(Date.now()-t0>=6000){clearInterval(iv);const a=gBuf.length?gBuf:[gLast],m=a.reduce((r,p)=>({lat:r.lat+p.lat/a.length,lon:r.lon+p.lon/a.length}),{lat:0,lon:0});gBuf=null;b.disabled=false;
      if(i===0)gTee=m;else gHole=m;gCalc();gUI()}},500)}
gb[0].onclick=()=>{if(gTee){gClear(0);return}gk=hn===10?'y':'r';gMeasure(0)};gb[1].onclick=()=>{if(gHole){gClear(1);return}gMeasure(1)};
gb[2].onclick=()=>{if(!gMe.s)return gManual();if(gMe.s)shot(gMe.x,gMe.z,true);else gS('Esperando tu posici\u00f3n\u2026')};
gb[3].onclick=()=>{if(demoT)gDemo();gStop()};
gpsb.onclick=()=>{const o=gpp.classList.toggle('open');if(o&&!gOn){gStart();setTimeout(()=>{if(gOn&&!gLast&&!demoT)gS('Sin respuesta del GPS tras 12 s. Puede estar bloqueado en este visor: prueba el modo demo o abre la página en el navegador.')},12000)}};
let demoT=null,gSaved=null;
function gManual(){const s=SCO[hn];if(s.done){banner('Hoyo terminado','Elige un tee o reinicia para repetirlo',1);return}s.n++;renderSC(1);banner('Golpe '+s.n,'Contado a mano: aún sin posición GPS',1)}
function gDemo(){const b=document.getElementById('g5');
  if(demoT){clearInterval(demoT);demoT=null;meClear();gCal=gSaved;gMe.s=false;accRing.visible=false;gOn=gw!==null;gpsb.classList.toggle('on',gOn);b.textContent='Probar sin GPS (demo)';gS('Demo parada');gUI();return}
  if(gw!==null){navigator.geolocation.clearWatch(gw);gw=null}
  meClear();gSaved=gCal;gCal={lat:42.3,lon:3.07,phi:0};gOn=true;gMe.s=false;gpsb.classList.add('on');b.textContent='Parar demo';
  const m=TEE[hn===10?'y':'r'];let k=0;
  const tick=()=>{k=Math.min(k+.03,1);const x=m[0]*(1-k)+(Math.random()-.5)*3,z=m[1]*(1-k)+(Math.random()-.5)*3;
    gFix({coords:{latitude:gCal.lat-z/110574,longitude:gCal.lon+x/(111320*Math.cos(gCal.lat*Math.PI/180)),accuracy:4}});gS('DEMO · a '+Math.round(Math.hypot(x,z))+' m del hoyo')};
  tick();demoT=setInterval(tick,1000)}
gErr=function(e){gS((e.code===1?'Ubicación bloqueada por el visor o por los permisos del móvil':'Sin señal GPS')+' (código '+e.code+'). Prueba el modo demo o abre la página en el navegador.')};
function gClear(i){meClear();if(i===0)gTee=null;else gHole=null;gCal=null;gMe.s=false;accRing.visible=false;gSave();gUI();gS(i===0?'Punto del tee borrado. Vuelve a marcarlo.':'Punto del hoyo borrado. Vuelve a marcarlo.')}
function gReset(){meClear();gTee=null;gHole=null;gCal=null;gMe.s=false;accRing.visible=false;try{localStorage.removeItem('gpsCal')}catch(e){}gUI();gS(gOn?'Calibración borrada. Marca el tee y el hoyo de nuevo.':'GPS apagado')}
document.getElementById('g5').onclick=gDemo;
gUI();gS('GPS apagado');

/* Tiempo real */
const WX={lat:42.315,lon:3.095,w:null},wxT=document.getElementById('wxT'),wxW=document.getElementById('wxW'),wxA=document.getElementById('wxA'),wxB=document.getElementById('wx');
let hb=null;try{const v=parseFloat(localStorage.getItem('hb'));if(!isNaN(v))hb=v}catch(e){}
let FB=0;
const card=d=>['N','NE','E','SE','S','SO','O','NO'][Math.round(d/45)%8];
function playBearing(){if(!gCal)return hb;const m=TEE[hn===10?'y':'r'],fx=-m[0],fz=-m[1],c=Math.cos(gCal.phi),s=Math.sin(gCal.phi),qx=fx*c+fz*s,qz=-fx*s+fz*c;return(Math.atan2(qx,-qz)*180/Math.PI+360)%360}
function wxF(){const w=WX.w,b=playBearing();if(!w||b===null||cur.g)return 1;const rel=((w.d+180-b)%360+360)%360,hw=-w.v*Math.cos(rel*Math.PI/180),a=hw>0?.02*hw:.01*hw;return 1+Math.max(-.25,Math.min(.25,a))}
function wxRender(){const w=WX.w;if(!w)return;wxT.textContent=Math.round(w.t)+'°C';const kmh=Math.round(w.v*3.6),b=playBearing();
  if(b===null){wxA.style.transform='rotate('+((w.d+180)%360)+'deg)';wxW.textContent=kmh+' km/h del '+card(w.d)+' · toca para orientar';return}
  const rel=((w.d+180-b)%360+360)%360,hw=-w.v*Math.cos(rel*Math.PI/180)*3.6;wxA.style.transform='rotate('+rel+'deg)';FB=(90-rel)*Math.PI/180;
  wxW.textContent=kmh+' km/h · '+(hw>=0?'en contra ':'a favor ')+Math.round(Math.abs(hw))+' km/h'}
async function wxLoad(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+WX.lat+'&longitude='+WX.lon+'&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=ms&timezone=auto'),j=await r.json(),c=j.current;
  WX.w={t:c.temperature_2m,v:c.wind_speed_10m,d:c.wind_direction_10m,g:c.wind_gusts_10m};wxRender();upd()}catch(e){wxT.textContent='--';wxW.textContent='Sin datos del tiempo (solo en la web alojada)'}}
wxB.onclick=()=>{if(!gCal){const v=parseFloat(prompt('Rumbo del hoyo desde el tee, en grados (0 = norte, 90 = este, 180 = sur, 270 = oeste):',hb===null?'':hb));if(!isNaN(v)){hb=((v%360)+360)%360;try{localStorage.setItem('hb',hb)}catch(e){}}}wxLoad()};
wxLoad();setInterval(wxLoad,600000);

/* C\u00e1mara */
const ctl=new THREE.OrbitControls(cam,cv);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI/2.05;ctl.minPolarAngle=.02;ctl.minDistance=6;ctl.maxDistance=420;
const V={'3d':[[-52,34,132],[0,RISE*.45,40]],top:[[0,215,46],[0,0,45]],green:[[0,RISE+24,30],[0,RISE,0]],side:[[130,16,48],[0,RISE*.5,48]]};
let tw=null;
function view(k){const[p,t]=V[k];tw={t0:performance.now(),p0:cam.position.clone(),t0v:ctl.target.clone(),p1:new THREE.Vector3(...p),t1:new THREE.Vector3(...t)};
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===k))}
cam.position.set(...V['3d'][0]);ctl.target.set(...V['3d'][1]);
document.getElementById('views').onclick=e=>{if(e.target.dataset.v)view(e.target.dataset.v)};
document.querySelector('.tees').onclick=e=>{const k=e.target.dataset.t;if(!k)return;startHole(k)};

/* Toque en el mapa -> posición -> metros */
const rc=new THREE.Raycaster(),ndc=new THREE.Vector2(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),-.5),hit=new THREE.Vector3();let d0=null;
cv.addEventListener('pointerdown',e=>{d0=e.isPrimary?{x:e.clientX,y:e.clientY,t:performance.now()}:null});
cv.addEventListener('pointerup',e=>{if(!d0)return;const mv=Math.hypot(e.clientX-d0.x,e.clientY-d0.y),dt=performance.now()-d0.t;d0=null;if(mv>8||dt>500)return;
  const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);rc.setFromCamera(ndc,cam);
  const hs=rc.intersectObjects(terrain);if(hs.length){const q=hs[0].point;if(Math.abs(q.x)<300&&Math.abs(q.z)<300)shot(q.x,q.z)}});

function resize(){const w=app.clientWidth,h=app.clientHeight;rd.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
setBall(...TEE.y,'Tee 10');

const v3=new THREE.Vector3();
(function loop(now){requestAnimationFrame(loop);
  if(tw){const k=Math.min((now-tw.t0)/700,1),s=k*k*(3-2*k);cam.position.lerpVectors(tw.p0,tw.p1,s);ctl.target.lerpVectors(tw.t0v,tw.t1,s);if(k>=1)tw=null}
  ctl.update();rd.render(scene,cam);drawClubs(now);fx(now);meFrame(now);
  const w=app.clientWidth,h=app.clientHeight;
  labels.forEach(o=>{v3.copy(o.pos).project(cam);const off=v3.z>1;o.e.style.display=off?'none':'block';if(!off)o.e.style.transform='translate('+((v3.x*.5+.5)*w)+'px,'+((-v3.y*.5+.5)*h)+'px) translate(-50%,-100%)'})
})(0);
</script>
